                name: { type: string, minLength: 1, maxLength: 60 }
              required: [token, platform, name]
      responses:
        "201":
          description: Registered notification device
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                required: [id]
  /mobile/push/devices/{deviceId}:
