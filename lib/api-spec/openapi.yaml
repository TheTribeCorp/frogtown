openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wallet
    description: Xaman wallet connection operations
  - name: conversations
    description: Direct and group chat operations
  - name: groups
    description: Group discovery and membership operations
  - name: timeline
    description: Public member timeline posts, likes, and comments
  - name: gamification
    description: Daily quests, points, streaks, and coin flips
  - name: notifications
    description: Private management of browser message-alert devices
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Checks API and PostgreSQL availability without exposing database details
      responses:
        "200":
          description: API and database are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /push/subscriptions:
    get:
      operationId: listPushSubscriptions
      tags: [notifications]
      summary: List notification devices for the signed-in wallet
      description: Returns opaque identifiers and dates only; push endpoints and encryption keys are never exposed.
      responses:
        "200":
          description: The signed-in wallet's notification devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionList"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Notification devices could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /push/subscriptions/{subscriptionId}:
    delete:
      operationId: revokePushSubscription
      tags: [notifications]
      summary: Revoke a notification device for the signed-in wallet
      parameters:
        - $ref: "#/components/parameters/PushSubscriptionId"
      responses:
        "204":
          description: Device revoked, or the identifier did not belong to this wallet
        "400":
          description: Invalid notification-device identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Notification device could not be revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/sessions:
    post:
      operationId: createWalletSession
      tags: [wallet]
      summary: Create an Xaman wallet sign-in session
      responses:
        "201":
          description: Xaman session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSession"
        "502":
          description: Xaman service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/sessions/{sessionId}:
    get:
      operationId: getWalletSession
      tags: [wallet]
      summary: Check the status of an Xaman wallet sign-in session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current wallet session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSessionStatus"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/evm/challenges:
    post:
      operationId: createLadyChainWalletChallenge
      tags: [wallet]
      summary: Create a one-time LadyChain wallet sign-in challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LadyChainWalletChallengeInput"
      responses:
        "201":
          description: Chain-bound message for the wallet to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LadyChainWalletChallenge"
        "400":
          description: Invalid EVM wallet address or request origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database or session signing configuration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/evm/sessions:
    post:
      operationId: createLadyChainWalletSession
      tags: [wallet]
      summary: Verify a LadyChain wallet signature and create a Frogtown session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LadyChainWalletSessionInput"
      responses:
        "200":
          description: Authenticated LadyChain wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LadyChainWalletSession"
        "400":
          description: Invalid, expired, or already-used sign-in challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet signature did not match the requested address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallets/{walletAddress}/hermit-tick:
    get:
      operationId: getWalletHermitTick
      tags: [wallet]
      summary: Check a wallet's $HERMIT holder tick on XRPL
      parameters:
        - in: path
          name: walletAddress
          required: true
          schema:
            type: string
            pattern: "^r[1-9A-HJ-NP-Za-km-z]{24,34}$"
        - in: query
          name: refresh
          required: false
          description: Skip the short public lookup cache; true is restricted to the authenticated wallet.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Current $HERMIT tick status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletHermitTick"
        "400":
          description: Invalid XRPL wallet address or query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: A fresh check requires a signed-in wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A signed-in wallet can only force-check itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/hermit-balance:
    get:
      operationId: getWalletHermitBalance
      tags: [wallet]
      summary: Get the authenticated wallet's $HERMIT and XRP balances
      parameters:
        - in: query
          name: refresh
          required: false
          description: Skip the short server cache after a wallet action.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Authenticated wallet balance and trustline state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletHermitBalance"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/me:
    get:
      operationId: getCurrentWallet
      tags: [wallet]
      summary: Return the wallet bound to the current browser session
      responses:
        "200":
          description: Authenticated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWallet"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/profile:
    get:
      operationId: getWalletProfile
      tags: [wallet]
      summary: Get the signed-in wallet's Frogtown username
      responses:
        "200":
          description: Wallet profile, including an unset username during onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletProfile"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveWalletUsername
      tags: [wallet]
      summary: Set or update the signed-in wallet's username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletUsernameInput"
      responses:
        "200":
          description: Updated wallet profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveWalletUsernameResult"
        "400":
          description: Username does not meet Frogtown's format requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/referral-device:
    post:
      operationId: claimReferralDeviceInstallation
      tags: [wallet]
      summary: Mark one browser installation as eligible for referral qualification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimReferralDeviceInput"
      responses:
        "200":
          description: Device installation claim result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimReferralDeviceResult"
        "400":
          description: Device installation identifier is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/logout:
    post:
      operationId: logoutWallet
      tags: [wallet]
      summary: Clear the current browser wallet session
      responses:
        "204":
          description: Session cleared
  /wallet/keys/{walletAddress}:
    get:
      operationId: getWalletEncryptionKey
      tags: [wallet]
      summary: Get a wallet's registered public encryption key
      parameters:
        - $ref: "#/components/parameters/WalletAddressPath"
      responses:
        "200":
          description: Public encryption key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletKey"
        "404":
          description: No encryption key registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/keys:
    put:
      operationId: registerWalletEncryptionKey
      tags: [wallet]
      summary: Register the current wallet's public encryption key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletKeyInput"
      responses:
        "200":
          description: Existing key confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletKey"
        "201":
          description: Public key registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletKey"
        "409":
          description: A different key is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/keys/reset:
    post:
      operationId: resetWalletEncryptionKey
      tags: [wallet]
      summary: Replace this wallet's encryption key and start chat history fresh
      description: Resets only the authenticated wallet's access to existing encrypted chat history; shared messages remain for other participants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletEncryptionResetInput"
      responses:
        "200":
          description: The key was replaced and this wallet's chat history was reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletEncryptionResetResult"
        "400":
          description: Invalid public encryption key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Encryption reset could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/blocks:
    get:
      operationId: listBlockedWallets
      tags: [wallet]
      summary: List wallets blocked by the current wallet
      responses:
        "200":
          description: Blocked wallet addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedWallet"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: blockWallet
      tags: [wallet]
      summary: Block a wallet from direct messaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockedWalletInput"
      responses:
        "201":
          description: Wallet blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedWallet"
        "400":
          description: Invalid wallet address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/blocks/{blockedWalletAddress}:
    delete:
      operationId: unblockWallet
      tags: [wallet]
      summary: Remove a wallet block
      parameters:
        - $ref: "#/components/parameters/BlockedWalletAddress"
      responses:
        "204":
          description: Wallet unblocked
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations for a wallet address
      parameters:
        - $ref: "#/components/parameters/WalletAddress"
      responses:
        "200":
          description: Conversation summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createDirectConversation
      tags: [conversations]
      summary: Start or return a direct conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectConversationInput"
      responses:
        "201":
          description: Direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/request/accept:
    post:
      operationId: acceptConversationRequest
      tags: [conversations]
      summary: Accept an incoming private-message request
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Accepted direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "403":
          description: Caller cannot accept this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/request/decline:
    post:
      operationId: declineConversationRequest
      tags: [conversations]
      summary: Decline an incoming private-message request
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Declined direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "403":
          description: Caller cannot decline this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: List messages in a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/WalletAddress"
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send an encrypted chat message
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark visible messages through a specific message as read
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadReceiptInput"
      responses:
        "200":
          description: Read position recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadReceipt"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found in this conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/keys:
    get:
      operationId: getConversationEncryptionKeys
      tags: [conversations]
      summary: Get registered public keys for the current conversation members
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation member keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationKey"
        "403":
          description: Caller is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/history-share-work:
    get:
      operationId: listConversationHistoryShareWork
      tags: [conversations]
      summary: Get encrypted group history that the current member can share with newer members
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: cursor
          in: query
          required: false
          description: Opaque cursor for continuing a bounded history-share scan or resuming at its latest checkpoint.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        "200":
          description: One bounded page of source ciphertext and eligible recipient keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistoryShareWorkPage"
        "403":
          description: Caller is not a group member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/history-shares:
    get:
      operationId: listConversationHistoryShares
      tags: [conversations]
      summary: List encrypted history shares addressed to the current wallet
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Recipient-only history ciphertext
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationHistoryShare"
        "403":
          description: Caller is not a group member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createConversationHistoryShare
      tags: [conversations]
      summary: Store a recipient-only encrypted copy of an older group message
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationHistoryShareInput"
      responses:
        "201":
          description: Encrypted history share stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistoryShare"
        "403":
          description: Caller is not an eligible existing member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List public and joined groups
      parameters:
        - $ref: "#/components/parameters/WalletAddress"
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: New group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{groupId}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupInput"
      responses:
        "200":
          description: Joined group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /timeline/posts:
    get:
      operationId: listTimelinePosts
      tags: [timeline]
      summary: List a cursor-paginated page of public timeline posts
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: A page of recent timeline posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePostsPage"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTimelinePost
      tags: [timeline]
      summary: Publish a text post as the authenticated wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelinePostInput"
      responses:
        "201":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePost"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/reports:
    post:
      operationId: reportTimelineContent
      tags: [timeline]
      summary: Report a public post or comment as the authenticated wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineReportInput"
      responses:
        "201":
          description: A new report was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineReportResult"
        "200":
          description: This wallet had already reported this content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineReportResult"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reported post or comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: This wallet has reached the report submission limit
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Report could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/posts/{postId}:
    patch:
      operationId: updateTimelinePost
      tags: [timeline]
      summary: Edit a timeline post owned by the authenticated wallet
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
