openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wallet
    description: Xaman wallet connection operations
  - name: conversations
    description: Direct and group chat operations
  - name: groups
    description: Group discovery and membership operations
  - name: timeline
    description: Public member timeline posts, likes, and comments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /wallet/sessions:
    post:
      operationId: createWalletSession
      tags: [wallet]
      summary: Create an Xaman wallet sign-in session
      responses:
        "201":
          description: Xaman session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSession"
        "502":
          description: Xaman service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/sessions/{sessionId}:
    get:
      operationId: getWalletSession
      tags: [wallet]
      summary: Check the status of an Xaman wallet sign-in session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current wallet session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSessionStatus"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/me:
    get:
      operationId: getCurrentWallet
      tags: [wallet]
      summary: Return the wallet bound to the current browser session
      responses:
        "200":
          description: Authenticated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWallet"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/logout:
    post:
      operationId: logoutWallet
      tags: [wallet]
      summary: Clear the current browser wallet session
      responses:
        "204":
          description: Session cleared
  /wallet/keys/{walletAddress}:
    get:
      operationId: getWalletEncryptionKey
      tags: [wallet]
      summary: Get a wallet's registered public encryption key
      parameters:
        - $ref: "#/components/parameters/WalletAddressPath"
      responses:
        "200":
          description: Public encryption key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletKey"
        "404":
          description: No encryption key registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/keys:
    put:
      operationId: registerWalletEncryptionKey
      tags: [wallet]
      summary: Register the current wallet's public encryption key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletKeyInput"
      responses:
        "200":
          description: Existing key confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletKey"
        "201":
          description: Public key registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletKey"
        "409":
          description: A different key is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations for a wallet address
      parameters:
        - $ref: "#/components/parameters/WalletAddress"
      responses:
        "200":
          description: Conversation summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createDirectConversation
      tags: [conversations]
      summary: Start or return a direct conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectConversationInput"
      responses:
        "201":
          description: Direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: List messages in a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/WalletAddress"
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send an encrypted chat message
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark visible messages through a specific message as read
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadReceiptInput"
      responses:
        "200":
          description: Read position recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadReceipt"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found in this conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/keys:
    get:
      operationId: getConversationEncryptionKeys
      tags: [conversations]
      summary: Get registered public keys for the current conversation members
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation member keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationKey"
        "403":
          description: Caller is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List public and joined groups
      parameters:
        - $ref: "#/components/parameters/WalletAddress"
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: New group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{groupId}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupInput"
      responses:
        "200":
          description: Joined group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /timeline/posts:
    get:
      operationId: listTimelinePosts
      tags: [timeline]
      summary: List a cursor-paginated page of public timeline posts
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: A page of recent timeline posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePostsPage"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTimelinePost
      tags: [timeline]
      summary: Publish a text post as the authenticated wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelinePostInput"
      responses:
        "201":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePost"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/reports:
    post:
      operationId: reportTimelineContent
      tags: [timeline]
      summary: Report a public post or comment as the authenticated wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineReportInput"
      responses:
        "201":
          description: Report recorded or already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineReportResult"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reported post or comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/posts/{postId}:
    patch:
      operationId: updateTimelinePost
      tags: [timeline]
      summary: Edit a timeline post owned by the authenticated wallet
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelinePostUpdateInput"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePost"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Post belongs to another wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTimelinePost
      tags: [timeline]
      summary: Remove a timeline post owned by the authenticated wallet
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204":
          description: Post and its comments removed
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Post belongs to another wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/posts/{postId}/likes:
    post:
      operationId: likeTimelinePost
      tags: [timeline]
      summary: Like a timeline post as the authenticated wallet
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePostReaction"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unlikeTimelinePost
      tags: [timeline]
      summary: Remove the authenticated wallet's like from a timeline post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePostReaction"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/posts/{postId}/comments:
    get:
      operationId: listTimelineComments
      tags: [timeline]
      summary: List a cursor-paginated page of comments on a timeline post
      parameters:
        - $ref: "#/components/parameters/PostId"
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A page of recent comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineCommentsPage"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTimelineComment
      tags: [timeline]
      summary: Comment on a timeline post as the authenticated wallet
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineCommentInput"
      responses:
        "201":
          description: Published comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineComment"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/posts/{postId}/comments/{commentId}:
    patch:
      operationId: updateTimelineComment
      tags: [timeline]
      summary: Edit a timeline comment owned by the authenticated wallet
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineCommentUpdateInput"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineComment"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Comment belongs to another wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTimelineComment
      tags: [timeline]
      summary: Remove a timeline comment owned by the authenticated wallet
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204":
          description: Comment removed
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Comment belongs to another wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/moderation/access:
    get:
      operationId: getTimelineModerationAccess
      tags: [timeline]
      summary: Check whether the authenticated wallet can review community reports
      responses:
        "200":
          description: Moderator access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineModeratorAccess"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/moderation/reports:
    get:
      operationId: listTimelineModerationReports
      tags: [timeline]
      summary: List unresolved reports for an authorized moderator
      responses:
        "200":
          description: Reports grouped by content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineModerationQueue"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a configured moderator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timeline/moderation/reports/{subjectType}/{subjectId}:
    post:
      operationId: resolveTimelineModerationReport
      tags: [timeline]
      summary: Dismiss reports or remove reported content as a moderator
      parameters:
        - $ref: "#/components/parameters/TimelineSubjectType"
        - $ref: "#/components/parameters/TimelineSubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineModerationActionInput"
      responses:
        "200":
          description: Moderation action completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineModerationActionResult"
        "401":
          description: Wallet session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a configured moderator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reported content not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
    TimelineSubjectType:
      name: subjectType
      in: path
      required: true
      schema:
        type: string
        enum: [post, comment]
    TimelineSubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: string
    WalletAddress:
      name: walletAddress
      in: query
      required: true
      schema:
        type: string
        minLength: 25
    WalletAddressPath:
      name: walletAddress
      in: path
      required: true
      schema:
        type: string
        minLength: 25
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    WalletSession:
      type: object
      properties:
        sessionId:
          type: string
        qrUrl:
          type: string
        deeplink:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [sessionId, qrUrl, deeplink, expiresAt]
    WalletSessionStatus:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
          enum: [pending, connected, expired]
        walletAddress:
          type: ["string", "null"]
        network:
          type: string
      required: [sessionId, status, walletAddress, network]
    CurrentWallet:
      type: object
      properties:
        walletAddress:
          type: string
        network:
          type: string
      required: [walletAddress, network]
    WalletKey:
      type: object
      properties:
        walletAddress:
          type: string
        publicKey:
          type: string
      required: [walletAddress, publicKey]
    WalletKeyInput:
      type: object
      properties:
        publicKey:
          type: string
          maxLength: 2048
      required: [publicKey]
    ConversationKey:
      type: object
      properties:
        walletAddress:
          type: string
        publicKey:
          type: ["string", "null"]
      required: [walletAddress, publicKey]
    Conversation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [direct, group]
        title:
          type: string
        participantLabel:
          type: string
        lastMessage:
          type: ["string", "null"]
        lastMessageAt:
          type: ["string", "null"]
          format: date-time
        unreadCount:
          type: integer
        encrypted:
          type: boolean
        memberCount:
          type: integer
      required: [id, type, title, participantLabel, lastMessage, lastMessageAt, unreadCount, encrypted, memberCount]
    DirectConversationInput:
      type: object
      properties:
        walletAddress:
          type: string
          minLength: 25
        fromWalletAddress:
          type: string
          minLength: 25
      required: [walletAddress, fromWalletAddress]
    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderAddress:
          type: string
        body:
          type: string
        sentAt:
          type: string
          format: date-time
        isMine:
          type: boolean
        encrypted:
          type: boolean
        isRead:
          type: boolean
      # Read state is derived per recipient and returned for every message.
      required: [id, conversationId, senderAddress, body, sentAt, isMine, encrypted, isRead]
    ReadReceiptInput:
      type: object
      properties:
        messageId:
          type: string
      required: [messageId]
    ReadReceipt:
      type: object
      properties:
        conversationId:
          type: string
        lastReadAt:
          type: string
          format: date-time
      required: [conversationId, lastReadAt]
    MessageInput:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        senderAddress:
          type: string
          minLength: 25
        body:
          type: string
          minLength: 1
      required: [messageId, senderAddress, body]
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        onlineCount:
          type: integer
        isJoined:
          type: boolean
        conversationId:
          type: string
      required: [id, name, description, memberCount, onlineCount, isJoined, conversationId]
    GroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
        creatorAddress:
          type: string
          minLength: 25
      required: [name, description, creatorAddress]
    JoinGroupInput:
      type: object
      properties:
        walletAddress:
          type: string
          minLength: 25
      required: [walletAddress]
    TimelinePost:
      type: object
      properties:
        id:
          type: string
        authorAddress:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        likeCount:
          type: integer
        commentCount:
          type: integer
        likedByMe:
          type: boolean
        reportedByMe:
          type: boolean
      required: [id, authorAddress, body, createdAt, likeCount, commentCount, likedByMe, reportedByMe]
    TimelinePostsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimelinePost"
        nextCursor:
          type: ["string", "null"]
      required: [items, nextCursor]
    TimelinePostInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
      required: [body]
