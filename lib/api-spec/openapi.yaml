      operationId: revokeMobilePushDevice
      tags: [mobile]
      summary: Revoke a native notification device belonging to the current wallet
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Device revoked or already absent
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
    TimelineSubjectType:
      name: subjectType
      in: path
      required: true
      schema:
        type: string
        enum: [post, comment]
    TimelineSubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: string
    WalletAddress:
      name: walletAddress
      in: query
      required: true
      schema:
        type: string
        minLength: 25
        maxLength: 42
    WalletAddressPath:
      name: walletAddress
      in: path
      required: true
      schema:
        type: string
        maxLength: 42
    BlockedWalletAddress:
      name: blockedWalletAddress
      in: path
      required: true
      schema:
        type: string
        minLength: 25
        maxLength: 42
    PushSubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
  schemas:
    MobilePushDevice:
      type: object
      properties:
        id: { type: string }
        platform: { type: string, enum: [ios, android] }
        name: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, platform, name, createdAt, updatedAt]
    HealthStatus:
      type: object
      description: Public API and database availability status
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
      required:
        - status
        - database
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    PushSubscriptionDevice:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{64}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, createdAt, updatedAt]
    PushSubscriptionList:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscriptionDevice"
      required: [subscriptions]
    WalletSession:
      type: object
      properties:
        sessionId:
          type: string
        qrUrl:
          type: string
        deeplink:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [sessionId, qrUrl, deeplink, expiresAt]
    WalletSessionStatus:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
          enum: [pending, connected, expired]
        walletAddress:
          type: ["string", "null"]
        network:
          type: string
      required: [sessionId, status, walletAddress, network]
    LadyChainWalletChallengeInput:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
      required: [address]
    LadyChainWalletChallenge:
      type: object
      properties:
        nonce:
          type: string
          pattern: "^[a-f0-9]{64}$"
        message:
          type: string
          maxLength: 1000
        expiresAt:
          type: string
          format: date-time
      required: [nonce, message, expiresAt]
    LadyChainWalletSessionInput:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        nonce:
          type: string
          pattern: "^[a-f0-9]{64}$"
        signature:
          type: string
          pattern: "^0x[a-fA-F0-9]{130}$"
      required: [address, nonce, signature]
    LadyChainWalletSession:
      type: object
      properties:
        walletAddress:
          type: string
          pattern: "^0x[a-f0-9]{40}$"
        network:
          type: string
          enum: [LadyChain]
      required: [walletAddress, network]
    WalletHermitTick:
      type: object
      properties:
        tick:
          type: ["string", "null"]
          enum: [green, gold, null]
        checkStatus:
          type: string
          enum: [checked, unavailable]
        checkedAt:
          type: string
          format: date-time
      required: [tick, checkStatus, checkedAt]
    WalletHermitBalance:
      type: object
      properties:
        balance:
          type: ["string", "null"]
        xrpBalance:
          type: ["string", "null"]
        xrpCheckStatus:
          type: string
          enum: [checked, unavailable]
        trustlineExists:
          type: ["boolean", "null"]
        checkStatus:
          type: string
          enum: [checked, unavailable]
        checkedAt:
          type: string
          format: date-time
      required: [balance, xrpBalance, xrpCheckStatus, trustlineExists, checkStatus, checkedAt]
    CurrentWallet:
      type: object
      properties:
        walletAddress:
          type: string
        network:
          type: string
      required: [walletAddress, network]
    WalletProfile:
      type: object
      properties:
        walletAddress:
          type: string
          pattern: "^(r[1-9A-HJ-NP-Za-km-z]{24,34}|0x[a-fA-F0-9]{40})$"
        username:
          type: ["string", "null"]
          minLength: 4
          maxLength: 17
          pattern: "^[A-Za-z0-9_]{4,17}$"
      required: [walletAddress, username]
    SaveWalletUsernameResult:
      allOf:
        - $ref: "#/components/schemas/WalletProfile"
        - type: object
          properties:
            referralStatus:
              type: string
              enum:
                - not_referred
                - pending
                - rewarded
                - device_already_used
                - device_check_unavailable
                - invalid_referrer
                - already_recorded
                - existing_wallet
          required: [referralStatus]
    ClaimReferralDeviceInput:
      type: object
      properties:
        deviceId:
          type: string
          maxLength: 36
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      required: [deviceId]
    ClaimReferralDeviceResult:
      type: object
      properties:
        eligible:
          type: boolean
      required: [eligible]
    WalletUsernameInput:
      type: object
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 17
