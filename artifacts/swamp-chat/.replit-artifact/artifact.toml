kind = "web"
previewPath = "/"
title = "Frogtown"
description = "A wallet-connected community app for $HERMIT, the chill frog of the XRPL. Frogtown brings people together with encrypted chats, community rooms, and a shared timeline."
version = "1.0.0"
id = "artifacts/swamp-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19364

[services.development]
run = "pnpm --filter @workspace/swamp-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swamp-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/swamp-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19364"
BASE_PATH = "/"
