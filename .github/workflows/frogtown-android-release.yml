name: Frogtown Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for the APK, for example android-v1.0.0
        required: true
        default: android-v1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: frogtown-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish signed Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frogtown_ci
          POSTGRES_USER: frogtown_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frogtown_ci -d frogtown_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EXPO_PUBLIC_API_URL: https://www.frogtown.online
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Set temporary signing path
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/frogtown-release-key.jks" >> "$GITHUB_ENV"

      - name: Check out Frogtown
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build targets
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a release tag such as android-v1.0.0."
            exit 1
          fi
          app_version="$(node -p "require('./artifacts/frogtown-mobile/app.json').expo.version")"
          if [[ "${RELEASE_TAG#android-v}" != "$app_version" ]]; then
            echo "::error::Release tag version must match the version in artifacts/frogtown-mobile/app.json ($app_version)."
            exit 1
          fi
          missing=()
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Add these repository Actions secrets before building: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Restore and validate the signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null

      - name: Run mobile and API regression checks
        env:
          DATABASE_URL: postgresql://frogtown_ci:isolated-ci-only@127.0.0.1:5432/frogtown_ci
        run: |
          pnpm --filter @workspace/db run push
          pnpm run typecheck:libs
          pnpm --filter @workspace/frogtown-mobile run typecheck
          pnpm --filter @workspace/scripts exec tsx --test ../artifacts/frogtown-mobile/test/crypto.test.mjs ../artifacts/frogtown-mobile/test/member-search.test.mjs ../artifacts/frogtown-mobile/test/android-release.test.mjs ../artifacts/frogtown-mobile/test/signed-in-actions.test.mjs
          pnpm --filter @workspace/api-server run test:auth

      - name: Generate the Android project
        working-directory: artifacts/frogtown-mobile
        run: pnpm exec expo prebuild --platform android --no-install --skip-dependency-update expo,react,react-native

      - name: Configure smaller architecture-specific APKs and universal fallback
        working-directory: artifacts/frogtown-mobile
        run: node scripts/configure-android-apk-splits.mjs

      - name: Configure release signing
        working-directory: artifacts/frogtown-mobile
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: node scripts/configure-android-release-signing.mjs

      - name: Build release APK
        working-directory: artifacts/frogtown-mobile/android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify APK signature and prepare download
        working-directory: artifacts/frogtown-mobile/android
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/release"
          for variant in arm64-v8a armeabi-v7a; do
            apk="$release_dir/app-${variant}-release.apk"
            test -s "$apk"
            contained_abis="$(unzip -Z -1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ { print $2 }' | sort -u | paste -sd, -)"
            if [[ "$contained_abis" != "$variant" ]]; then
              echo "::error::Expected the $variant APK to contain only $variant native libraries; found: $contained_abis"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            cp "$apk" "$RUNNER_TEMP/Frogtown-${variant}.apk"
          done
          universal="$release_dir/app-universal-release.apk"
          test -s "$universal"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$universal"
          cp "$universal" "$RUNNER_TEMP/Frogtown.apk"
          cd "$RUNNER_TEMP"
          arm64_size="$(stat -c%s Frogtown-arm64-v8a.apk)"
          universal_size="$(stat -c%s Frogtown.apk)"
          if (( arm64_size >= universal_size )); then
            echo "::error::The arm64 APK must be smaller than the universal fallback."
            exit 1
          fi
          sha256sum Frogtown.apk Frogtown-arm64-v8a.apk Frogtown-armeabi-v7a.apk > Frogtown-android-sha256.txt
          ls -lh Frogtown.apk Frogtown-arm64-v8a.apk Frogtown-armeabi-v7a.apk

      - name: Save APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frogtown-android-apk
          path: |
            ${{ runner.temp }}/Frogtown.apk
            ${{ runner.temp }}/Frogtown-arm64-v8a.apk
            ${{ runner.temp }}/Frogtown-armeabi-v7a.apk
            ${{ runner.temp }}/Frogtown-android-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Frogtown Android ${RELEASE_TAG}"
          notes="Signed Frogtown Android APKs. Download the arm64 build for most modern phones, armeabi-v7a for 32-bit phones, or Frogtown.apk as a universal fallback. APK sizes and SHA-256 checksums are provided. Future updates must use the same Frogtown signing key."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Frogtown.apk" "$RUNNER_TEMP/Frogtown-arm64-v8a.apk" "$RUNNER_TEMP/Frogtown-armeabi-v7a.apk" "$RUNNER_TEMP/Frogtown-android-sha256.txt" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$title" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --draft
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Frogtown.apk" "$RUNNER_TEMP/Frogtown-arm64-v8a.apk" "$RUNNER_TEMP/Frogtown-armeabi-v7a.apk" "$RUNNER_TEMP/Frogtown-android-sha256.txt"
          fi
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
